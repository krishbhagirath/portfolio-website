<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" role="img" aria-label="NeuraCore: 4-MAC neural network accelerator datapath">
  <defs>
    <linearGradient id="nc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <pattern id="nc-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="nc-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#9aa0a6"/>
    </marker>
  </defs>

  <rect width="1200" height="675" fill="url(#nc-bg)"/>
  <rect width="1200" height="675" fill="url(#nc-grid)"/>

  <text x="72" y="104" fill="#f5f5f5" font-family="ui-sans-serif,system-ui,Segoe UI,Helvetica,Arial" font-size="46" font-weight="300" letter-spacing="1">NeuraCore</text>
  <text x="72" y="142" fill="#9aa0a6" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19" letter-spacing="2">INT8 ACCELERATOR &#183; 8 &#8594; 16 + ReLU</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <rect x="72" y="238" width="180" height="76" rx="8" fill="#141414" stroke="#3a3a3a" stroke-width="2"/>
    <text x="92" y="272" fill="#e8e8e8" font-size="18">input mem</text>
    <text x="92" y="296" fill="#7a7f85" font-size="14">8 &#215; int8</text>

    <rect x="72" y="336" width="180" height="76" rx="8" fill="#141414" stroke="#3a3a3a" stroke-width="2"/>
    <text x="92" y="370" fill="#e8e8e8" font-size="18">weight mem</text>
    <text x="92" y="394" fill="#7a7f85" font-size="14">128 &#215; int8</text>

    <rect x="72" y="434" width="180" height="76" rx="8" fill="#141414" stroke="#3a3a3a" stroke-width="2"/>
    <text x="92" y="468" fill="#e8e8e8" font-size="18">bias mem</text>
    <text x="92" y="492" fill="#7a7f85" font-size="14">16 &#215; int32</text>

    <rect x="340" y="222" width="300" height="306" rx="10" fill="#111111" stroke="#5a5a5a" stroke-width="2"/>
    <text x="364" y="258" fill="#9aa0a6" font-size="15" letter-spacing="2">4-MAC ARRAY</text>

    <rect x="364" y="278" width="118" height="110" rx="8" fill="#1d1d1d" stroke="#4a4a4a" stroke-width="2"/>
    <text x="390" y="330" fill="#e8e8e8" font-size="20">MAC0</text>
    <text x="382" y="356" fill="#7a7f85" font-size="13">a&#215;w+acc</text>

    <rect x="498" y="278" width="118" height="110" rx="8" fill="#1d1d1d" stroke="#4a4a4a" stroke-width="2"/>
    <text x="524" y="330" fill="#e8e8e8" font-size="20">MAC1</text>
    <text x="516" y="356" fill="#7a7f85" font-size="13">a&#215;w+acc</text>

    <rect x="364" y="402" width="118" height="110" rx="8" fill="#1d1d1d" stroke="#4a4a4a" stroke-width="2"/>
    <text x="390" y="454" fill="#e8e8e8" font-size="20">MAC2</text>
    <text x="382" y="480" fill="#7a7f85" font-size="13">a&#215;w+acc</text>

    <rect x="498" y="402" width="118" height="110" rx="8" fill="#1d1d1d" stroke="#4a4a4a" stroke-width="2"/>
    <text x="524" y="454" fill="#e8e8e8" font-size="20">MAC3</text>
    <text x="516" y="480" fill="#7a7f85" font-size="13">a&#215;w+acc</text>

    <rect x="712" y="278" width="200" height="194" rx="10" fill="#141414" stroke="#3a3a3a" stroke-width="2"/>
    <text x="736" y="320" fill="#e8e8e8" font-size="19">post-process</text>
    <text x="736" y="356" fill="#9aa0a6" font-size="15">+ bias (int32)</text>
    <text x="736" y="386" fill="#9aa0a6" font-size="15">&gt;&gt;&gt; rescale</text>
    <text x="736" y="416" fill="#9aa0a6" font-size="15">ReLU + saturate</text>
    <text x="736" y="446" fill="#7a7f85" font-size="15">&#8594; int8 [0,127]</text>

    <rect x="972" y="316" width="156" height="118" rx="10" fill="#141414" stroke="#3a3a3a" stroke-width="2"/>
    <text x="996" y="366" fill="#e8e8e8" font-size="19">output</text>
    <text x="996" y="394" fill="#7a7f85" font-size="14">16 &#215; int8</text>

    <g stroke="#9aa0a6" stroke-width="2" fill="none" marker-end="url(#nc-arrow)">
      <path d="M256 276h76"/>
      <path d="M256 374h76"/>
      <path d="M256 472h76"/>
      <path d="M644 375h60"/>
      <path d="M916 375h48"/>
    </g>

    <rect x="72" y="556" width="1056" height="66" rx="10" fill="#111111" stroke="#2e2e2e" stroke-width="2"/>
    <text x="100" y="596" fill="#c9c9c9" font-size="18">ONNX &#8594; INT8 quantize &#8594; RTL &#183; 100 cocotb inferences, bit-exact vs. golden model</text>
  </g>
</svg>
